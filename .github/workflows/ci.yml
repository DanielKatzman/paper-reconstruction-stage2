name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-inference.txt
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - name: CPU-only production smoke test
        run: |
          output_dir="$(mktemp -d)/stage2"
          python scripts/run_stage2_inference.py --input examples/stage1_output --output "$output_dir" --no-overlays
          python scripts/verify_stage2_output.py --input "$output_dir" --release models/release.json
